<section class="projects-container">
    <div class="projects-header">
        <h2>Mis Proyectos</h2>
        <p>Una colección de mis trabajos más recientes y experimentos técnicos, realizados a lo largo de toda mi etapa secundaria.</p>
    </div>

    <div class="projects-grid">

        @for (project of projects; track $index) 
        {
            <a [href]="project.url_github" class="project-card">
                <div class="project-image">
                    <img [src]="project.img" [alt]="project.alt_img">
                    <div class="image-overlay">
                    </div>
                </div>
                <div class="project-info">
                    <h3>{{project.title}}</h3>
                    <p>{{project.description}}</p>
                </div>
            </a>
        }
    </div>
</section>
